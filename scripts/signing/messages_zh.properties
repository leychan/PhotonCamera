usage=用法：\n  sh scripts/signing.sh pack --keystore /path/to/release.jks --alias ALIAS [--force]\n  sh scripts/signing.sh setup\n需要 JDK 17+、PATH 中的 age 和本地终端（Linux/macOS/WSL）。详见 docs/signing.md。
invalidArguments=参数不正确，请使用 --help 查看用法。
storePassword=现有密钥库密码：
keyPassword=现有私钥密码（直接回车则使用密钥库密码）：
terminalRequired=请在本地终端直接运行此命令，密码输入不能重定向。
cancelled=已取消。
bundleExists=config/signing.age 已存在，如需替换请明确传入 --force。
bundleMissing=缺少 config/signing.age，请先在原机器上封装加密密钥包。
invalidBundle=密钥包格式错误或版本不受支持。
invalidKey=无法解锁私钥和证书链，请检查密钥文件、别名及签名密码。
tooLarge=签名输入超过 8 MiB 限制。
ageFailed=age 执行失败，原有密钥包和本地签名配置已保留。
ageMissing=请先安装 age 并确保它在 PATH 中，详见 docs/signing.md。
invalidLocalDirectory=.signing 必须是真实目录，不能是符号链接。
busy=另一个签名操作正在运行，请在其完成后重试。
fingerprint=签名证书 SHA-256：%s
packed=加密密钥包已保存：%s\n请在仓库外妥善保管 age 解密密码，运行 setup 配置当前机器。
configured=本地签名已配置：%s
operationFailed=操作失败（%s），请检查文件权限、JDK 17+、PATH 中的 age，以及 docs/signing.md。
error=错误：%s
