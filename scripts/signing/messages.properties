usage=Usage:\n  sh scripts/signing.sh init [--alias photon-release]\n  sh scripts/signing.sh pack --keystore /path/to/release.jks --alias ALIAS [--force]\n  sh scripts/signing.sh setup [--passphrase-file PATH]\nRequires JDK 17+, age, and age-plugin-batchpass for init/CI/file-based unlock (Linux/macOS/WSL). See docs/signing.md.
invalidArguments=Invalid arguments. Run with --help for usage.
storePassword=Existing keystore password: 
keyPassword=Existing private key password (Enter to reuse keystore password): 
terminalRequired=Run this command directly in a local terminal; password input cannot be redirected.
cancelled=Cancelled.
bundleExists=config/signing.age already exists. Use --force to replace it deliberately.
bundleMissing=config/signing.age is missing. Create the encrypted bundle on the original machine first.
invalidBundle=Invalid or unsupported signing bundle.
invalidKey=Cannot unlock the private key and certificate chain. Check the keystore, alias, and signing passwords.
tooLarge=Signing input exceeds the 8 MiB limit.
ageFailed=age failed; the existing bundle and local signing configuration were preserved.
ageMissing=Install age and make sure it is on PATH before running this command. See docs/signing.md.
invalidLocalDirectory=.signing must be a real directory, not a symbolic link.
busy=Another signing operation is running. Try again after it completes.
fingerprint=Signing certificate SHA-256: %s
packed=Encrypted bundle saved: %s\nKeep the age passphrase outside the repository. Run setup to configure this machine.
configured=Local signing configured: %s
operationFailed=Operation failed (%s). Check file permissions, JDK 17+, age on PATH, and docs/signing.md.
error=Error: %s
pluginMissing=Install the official age-plugin-batchpass plugin and ensure it is on PATH. See docs/signing.md.
passphraseMissing=Provide a nonempty RELEASE_SIGNING_PASSPHRASE in CI, or use --passphrase-file for local automation.
conflictingPassphrases=Use either RELEASE_SIGNING_PASSPHRASE or --passphrase-file, not both.
alreadyInitialized=Signing material already exists. init refuses to replace an existing bundle, configuration, or master passphrase.
keyGenerationFailed=keytool failed to generate the release signing key.
initialized=Release signing key generated and configured. Master passphrase file: %s\nBack up this file securely outside the repository. GitHub Actions uses its contents as RELEASE_SIGNING_PASSPHRASE.
